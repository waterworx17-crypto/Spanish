<head>

<!-- These lines make it work as its own app on the iPhone home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

  index.html - THE PAGE

-->

<main class="app" id="app"></main>

<div class="action-bar" id="action-bar" hidden>

</div>

<script src="pronounce.js"></script>
